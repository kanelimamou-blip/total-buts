name: Mise à jour des prédictions

on:
  schedule:
    - cron: "5 * * * *"   # toutes les heures (heure de Dakar = UTC)
  workflow_dispatch:
    inputs:
      backtest:
        description: "Relancer le test sur le passé"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", "docs/revision/**", "docs/*.html", "docs/*.js", "docs/*.css", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # une exécution en file d'attente repart des dernières données, pas du commit qui l'a déclenchée
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcul du jour
        run: python pipeline/run_daily.py ${{ inputs.backtest && '--backtest' || '' }}
      - name: Enregistrer les données
        run: |
          git config user.name "total-buts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs origin main   # en cas de conflit, les données qu'on vient de calculer gagnent
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
